
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Entre na sua conta LIA, Local de Informação e Apoio.">
  <meta name="theme-color" content="#7653a6">
  <title>Entrar na conta | LIA</title>
  <link rel="stylesheet" href="lia.css">
</head>
<body>
  <header class="header">
    <div class="container nav-container">
      <a class="logo" href="index.html" aria-label="LIA - página inicial">
        <span class="logo-icon">L</span>
        <span class="logo-name">LIA</span>
      </a>
      <nav class="navigation" id="navigation">
        <a href="index.html">Início</a>
        <a href="projeto.html">Conheça o projeto</a>
        <a href="cadastro.html">Criar conta</a>
      </nav>
    </div>
  </header>

  <main class="page-content">
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">Bem-vinda ao LIA</p>
        <h1>Entre na sua conta</h1>
        <p>Acesse sua conta para continuar.</p>
      </div>
    </section>

    <section class="container" style="max-width:620px;margin:32px auto;">
      <div class="content-card">
        <form id="loginForm">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email"
            autocomplete="email" required>

          <label for="password">Senha</label>
          <input id="password" name="password" type="password"
            autocomplete="current-password" required>

          <button class="btn btn-main" id="loginButton"
            type="submit" style="margin-top:20px;width:100%;">
            Entrar
          </button>

          <p id="loginMessage" role="status"
            aria-live="polite" style="margin-top:16px;"></p>
        </form>

        <p style="margin-top:20px;">
          Ainda não tem conta?
          <a href="cadastro.html">Criar conta</a>
        </p>

        <p style="margin-top:12px;">
          <a href="index.html">Voltar à página inicial</a>
        </p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>LIA — Local de Informação e Apoio</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="lia-supabase.js"></script>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("loginMessage");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";

      if (
        !window.supabase ||
        !window.LIA_SUPABASE_URL ||
        !window.LIA_SUPABASE_PUBLISHABLE_KEY ||
        window.LIA_SUPABASE_PUBLISHABLE_KEY.includes("COLE_AQUI")
      ) {
        message.textContent =
          "A conexão não está configurada. Confira o arquivo lia-supabase.js.";
        return;
      }

      button.disabled = true;
      button.textContent = "Entrando...";

      try {
        const client = window.supabase.createClient(
          window.LIA_SUPABASE_URL,
          window.LIA_SUPABASE_PUBLISHABLE_KEY
        );

        const { error } = await client.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        });

        if (error) throw error;

        message.textContent = "Login realizado! Abrindo o LIA...";
        window.location.href = "index.html";
      } catch (error) {
        console.error("Erro no login:", error);
        message.textContent =
          "Não foi possível entrar. Confira o e-mail, a senha e a confirmação do e-mail.";
      } finally {
        button.disabled = false;
        button.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
