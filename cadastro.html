
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crie sua conta no LIA, Local de Informação e Apoio.">
  <meta name="theme-color" content="#7653a6">
  <title>Criar conta | LIA</title>
  <link rel="stylesheet" href="lia.css">
</head>
<body>
  <header class="header">
    <div class="container nav-container">
      <a class="logo" href="index.html" aria-label="LIA - página inicial">
        <span class="logo-icon">L</span>
        <span class="logo-name">LIA</span>
      </a>
      <nav class="navigation" id="navigation">
        <a href="index.html">Início</a>
        <a href="projeto.html">Conheça o projeto</a>
        <a href="conta.html">Entrar</a>
      </nav>
    </div>
  </header>

  <main class="page-content">
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">Sua conta LIA</p>
        <h1>Crie sua conta</h1>
        <p>Preencha os dados para começar.</p>
      </div>
    </section>

    <section class="container" style="max-width:620px;margin:32px auto;">
      <div class="content-card">
        <form id="signupForm">
          <label for="fullName">Nome completo</label>
          <input id="fullName" name="fullName" type="text"
            autocomplete="name" required>

          <label for="phone">Telefone (opcional)</label>
          <input id="phone" name="phone" type="tel"
            autocomplete="tel">

          <label for="email">E-mail</label>
          <input id="email" name="email" type="email"
            autocomplete="email" required>

          <label for="password">Senha (mínimo de 8 caracteres)</label>
          <input id="password" name="password" type="password"
            autocomplete="new-password" minlength="8" required>

          <label for="confirmPassword">Confirme sua senha</label>
          <input id="confirmPassword" name="confirmPassword"
            type="password" autocomplete="new-password"
            minlength="8" required>

          <button class="btn btn-main" id="signupButton"
            type="submit" style="margin-top:20px;width:100%;">
            Criar conta
          </button>

          <p id="signupMessage" role="status"
            aria-live="polite" style="margin-top:16px;"></p>
        </form>

        <p style="margin-top:20px;">
          Já tem uma conta?
          <a href="conta.html">Entrar</a>
        </p>

        <p class="privacy-notice">
          Seus dados de cadastro são enviados ao serviço de autenticação
          do LIA. Não informe dados pessoais de outras pessoas.
        </p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>LIA — Local de Informação e Apoio</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="lia-supabase.js"></script>

  <script>
    const form = document.getElementById("signupForm");
    const message = document.getElementById("signupMessage");
    const button = document.getElementById("signupButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";

      const fullName = document.getElementById("fullName").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmation =
        document.getElementById("confirmPassword").value;

      if (password !== confirmation) {
        message.textContent = "As senhas não são iguais.";
        return;
      }

      if (password.length < 8) {
        message.textContent = "A senha precisa ter pelo menos 8 caracteres.";
        return;
      }

      if (
        !window.supabase ||
        !window.LIA_SUPABASE_URL ||
        !window.LIA_SUPABASE_PUBLISHABLE_KEY ||
        window.LIA_SUPABASE_PUBLISHABLE_KEY.includes("COLE_AQUI")
      ) {
        message.textContent =
          "A conexão ainda não está configurada. Confira o arquivo lia-supabase.js.";
        return;
      }

      button.disabled = true;
      button.textContent = "Criando conta...";

      try {
        const client = window.supabase.createClient(
          window.LIA_SUPABASE_URL,
          window.LIA_SUPABASE_PUBLISHABLE_KEY
        );

        const { data, error } = await client.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: fullName,
              phone: phone
            }
          }
        });

        if (error) throw error;

        if (data.session) {
          message.textContent =
            "Conta criada! Você já pode entrar no LIA.";
          form.reset();
        } else {
          message.textContent =
            "Cadastro enviado! Confira seu e-mail para confirmar a conta antes de entrar.";
        }
      } catch (error) {
        console.error("Erro no cadastro:", error);
        message.textContent =
          error.message || "Não foi possível criar a conta. Tente novamente.";
      } finally {
        button.disabled = false;
        button.textContent = "Criar conta";
      }
    });
  </script>
</body>
</html>
